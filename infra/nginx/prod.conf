# Production reverse proxy template: terminates TLS, routes /api/* and /docs
# to the API service, everything else to the static web build. Replace the
# cert paths with your real certificate (Let's Encrypt/certbot, ACM, etc.)
# before use — this file is a starting point, not a turnkey TLS setup.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api:4000;
    }

    location /openapi.json {
        proxy_pass http://api:4000;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
