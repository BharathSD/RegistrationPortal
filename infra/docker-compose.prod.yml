name: cricket-platform-prod

# Single-VM production starting point (see docs/DEPLOYMENT.md #3.3).
# Postgres and Redis are expected to be EXTERNAL managed services — this
# file intentionally does not run its own database containers in
# production. Run `prisma migrate deploy` as a separate one-shot step
# BEFORE bringing up `api` on a new release (see docs/DEPLOYMENT.md #3.4).

services:
  api:
    image: ${API_IMAGE:-cricket-platform/api:latest}
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    expose:
      - "4000"
    volumes:
      - api_uploads:/app/apps/api/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/healthz', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ${WEB_IMAGE:-cricket-platform/web:latest}
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web

volumes:
  api_uploads:
