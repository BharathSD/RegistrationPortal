name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace packages/shared
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run lint
      - run: npx tsc --noEmit -p apps/api/tsconfig.json
      - run: npx tsc --noEmit -p apps/web/tsconfig.json

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cricket_admin
          POSTGRES_PASSWORD: cricket_test_password
          POSTGRES_DB: cricket_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://cricket_admin:cricket_test_password@localhost:5432/cricket_platform_test?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-test-refresh-secret-0123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace packages/shared
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run test:all --workspace apps/api
        env:
          # runIf-guarded suites use this same DATABASE_URL, now migrated and reachable
          DATABASE_URL: postgresql://cricket_admin:cricket_test_password@localhost:5432/cricket_platform_test?schema=public

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace packages/shared
      - run: npm run build --workspace apps/web
        env:
          VITE_API_BASE_URL: /api/v1

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, api-tests, web-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: cricket-platform/api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: cricket-platform/web:ci
